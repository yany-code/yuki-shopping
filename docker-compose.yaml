services:
  mysql:
    image: mysql:8.4
    container_name: yuki-mysql
    restart: unless-stopped
    environment:
      # 密码统一从项目根目录 .env 读取（compose 自动加载），缺失时直接报错
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 MYSQL_ROOT_PASSWORD，请复制 .env.example 为 .env}
      MYSQL_DATABASE: yuki_shopping
      MYSQL_USER: yuki
      MYSQL_PASSWORD: ${DB_PASSWORD:?缺少 DB_PASSWORD，请复制 .env.example 为 .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: yuki-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?缺少 REDIS_PASSWORD，请复制 .env.example 为 .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # command 不经过 shell，$$ 需通过 sh -c 展开容器环境变量，否则密码会变成字面量
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data: